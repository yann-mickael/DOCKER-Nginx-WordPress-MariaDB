server {
    listen 80;
    # NB : "${DOMAIN_NAME}" ne fonctionnerait pas ici. Ce fichier est
    # copié tel quel dans l'image au moment du `docker build` (voir
    # nginx/Dockerfile) : Nginx ne fait AUCUNE substitution de
    # variables d'environnement sur un fichier .conf classique (ça ne
    # marche qu'avec le mécanisme de templates de l'image officielle,
    # non utilisé ici). "_" = catch-all, valable pour "localhost"
    # comme pour un vrai nom de domaine.
    server_name _;

    # Requis pour la validation Certbot (HTTP-01 challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /phpmyadmin {
        proxy_pass http://phpmyadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Certificat auto-signé pour usage local (voir README pour la
    # génération). Remplacer par les chemins Certbot
    # (/etc/letsencrypt/live/${DOMAIN_NAME}/...) en production avec
    # un vrai nom de domaine.
    ssl_certificate     /etc/nginx/certificates/localhost.crt;
    ssl_certificate_key /etc/nginx/certificates/localhost.key;

    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /phpmyadmin {
        proxy_pass http://phpmyadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
