user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    # --- Corrections apportées ici ---
    # Le nginx.conf original se limitait à un `include conf.d/default.conf`
    # sans charger les types MIME. Résultat : les fichiers .css / .js de
    # WordPress pouvaient être servis avec un mauvais Content-Type et être
    # ignorés par le navigateur (page d'admin non stylée, etc.).
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Logs écrits dans des fichiers réels (nécessaire pour Fail2Ban,
    # voir README) plutôt que sur stdout/stderr comme le fait l'image
    # nginx officielle par défaut.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    include /etc/nginx/conf.d/*.conf;
}
